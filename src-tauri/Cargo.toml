[package]
name = "dsweb-proxy-app"
version = "0.1.0"
description = "DeepSeek 网页版 → OpenAI 兼容反代（桌面壳）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "dsweb-proxy-app"
path = "src/main.rs"
